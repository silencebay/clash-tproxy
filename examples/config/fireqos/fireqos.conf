# FireQOS Configuration Example
# This configuration uses the traffic marks set by the traffic-marking hooks
# Copy this file to your FireQOS configuration location

# =============================================================================
# Interface Configuration
# =============================================================================
# Adjust interface name and total bandwidth according to your setup

interface eth0 world-out output rate 1000mbit
    # VoIP and Real-time Communication - Highest Priority
    class voip commit 20mbit prio 1 ceil 50mbit
        match mark 0x300 0x301 0x302 0x303 0x304 0x800 0x801 0x802
        
    # Gaming - Low latency, guaranteed bandwidth
    class gaming commit 100mbit prio 2 ceil 300mbit
        match mark 0x10 0x11 0x12 0x13 0x100 0x101 0x102 0x103
        
    # Work Traffic - Business priority
    class work commit 80mbit prio 3 ceil 200mbit
        match mark 0x30 0x31 0x32 0x400 0x401 0x402 0x403 0x404 0x405
        
    # Streaming - High bandwidth for media
    class streaming commit 200mbit prio 4 ceil 500mbit
        match mark 0x20 0x21 0x22 0x23 0x200 0x201 0x202 0x203
        
    # Mobile Devices - Standard priority
    class mobile commit 50mbit prio 5 ceil 150mbit
        match mark 0x40 0x41 0x42
        
    # File Transfer and Cloud - Medium priority
    class filetransfer commit 30mbit prio 6 ceil 100mbit
        match mark 0x500 0x501 0x502 0x503
        
    # IoT Devices - Limited bandwidth
    class iot commit 10mbit prio 7 ceil 30mbit
        match mark 0x50 0x51 0x52 0x53 0x700 0x701 0x702
        
    # P2P and Bulk Downloads - Lowest priority
    class bulk commit 20mbit prio 8 ceil 50mbit
        match mark 0x600 0x601 0x602

# =============================================================================
# Incoming Traffic (Download)
# =============================================================================

interface eth0 world-in input rate 1000mbit
    # VoIP and Real-time - Highest Priority
    class voip commit 20mbit prio 1 ceil 50mbit
        match mark 0x300 0x301 0x302 0x303 0x304 0x800 0x801 0x802
        
    # Gaming - Low latency
    class gaming commit 100mbit prio 2 ceil 300mbit
        match mark 0x10 0x11 0x12 0x13 0x100 0x101 0x102 0x103
        
    # Work Traffic
    class work commit 80mbit prio 3 ceil 200mbit
        match mark 0x30 0x31 0x32 0x400 0x401 0x402 0x403 0x404 0x405
        
    # Streaming - High bandwidth
    class streaming commit 300mbit prio 4 ceil 600mbit
        match mark 0x20 0x21 0x22 0x23 0x200 0x201 0x202 0x203
        
    # Mobile Devices
    class mobile commit 50mbit prio 5 ceil 150mbit
        match mark 0x40 0x41 0x42
        
    # File Transfer
    class filetransfer commit 50mbit prio 6 ceil 150mbit
        match mark 0x500 0x501 0x502 0x503
        
    # IoT Devices
    class iot commit 10mbit prio 7 ceil 30mbit
        match mark 0x50 0x51 0x52 0x53 0x700 0x701 0x702
        
    # P2P and Bulk
    class bulk commit 30mbit prio 8 ceil 100mbit
        match mark 0x600 0x601 0x602

# =============================================================================
# Configuration Notes
# =============================================================================
#
# Bandwidth Allocation Strategy:
# - VoIP: Small but guaranteed bandwidth with low latency
# - Gaming: Moderate guaranteed bandwidth, can burst higher
# - Work: Business-critical applications get priority
# - Streaming: High bandwidth for video content
# - Mobile: Standard allocation for phones/tablets
# - File Transfer: Moderate priority for legitimate transfers
# - IoT: Limited bandwidth to prevent congestion
# - Bulk/P2P: Lowest priority, uses remaining bandwidth
#
# Priority Levels (1 = highest, 8 = lowest):
# 1. VoIP/Real-time (latency critical)
# 2. Gaming (latency sensitive)
# 3. Work (business critical)
# 4. Streaming (bandwidth hungry)
# 5. Mobile (standard usage)
# 6. File Transfer (can wait)
# 7. IoT (background traffic)
# 8. Bulk/P2P (best effort)
#
# Adjust the 'rate', 'commit', and 'ceil' values according to:
# - Your actual internet connection speed
# - Number of devices on your network
# - Your specific usage patterns
#
# Testing:
# - Monitor with: fireqos status
# - Check marks: nft list table inet qos_marking
# - Debug traffic: tcpdump -i any -n | grep "mark"
