# =============================================================================
# FireQOS Configuration for mihomo TProxy + QoS Integration
# =============================================================================
# This configuration demonstrates how to use traffic marks set by the nftables
# traffic-marking hooks for Quality of Service classification.
#
# INTEGRATION OVERVIEW:
# ---------------------
# 1. nftables hooks mark packets based on MAC/IP/Port/Protocol
# 2. FireQOS uses these marks to classify traffic into QoS classes
# 3. Both systems coexist with TProxy without conflicts
#
# MARKING SYSTEM:
# ---------------
# - TProxy uses low 16 bits (0x0000FFFF) for routing
# - QoS uses high 16 bits (0xFFFF0000) for classification
# - FireQOS matches on QoS marks while ignoring TProxy marks
#
# MARK ALLOCATION:
# ----------------
# 0x10000: Gaming devices (highest priority, low latency)
# 0x20000: Streaming devices (high bandwidth, medium priority)
# 0x30000: Work devices (business priority, guaranteed bandwidth)
# 0x40000: Mobile devices (standard priority)
# 0x50000: IoT devices (low priority, limited bandwidth)
# 0x100000+: Advanced multi-condition rules
#
# SETUP INSTRUCTIONS:
# -------------------
# 1. Configure traffic-marking.conf with your device MAC addresses
# 2. Run the traffic marking hooks to create nftables rules
# 3. Copy this file to your FireQOS configuration location
# 4. Adjust interface names and bandwidth limits for your setup
# 5. Start FireQOS: fireqos start
# =============================================================================

# =============================================================================
# Interface Configuration
# =============================================================================
# Adjust interface name and total bandwidth according to your setup

# =============================================================================
# Output Interface Configuration
# =============================================================================
# Adjust interface name and bandwidth according to your setup

interface eth0 world-out output rate 1000mbit
    # Gaming Traffic - Highest Priority (Low Latency)
    # Matches devices marked with 0x10000 by DMAC rules
    # and advanced gaming rules (0x100000+)
    class gaming commit 100mbit prio 1 ceil 300mbit
        match mark 0x10000          # Gaming devices (DMAC rules)
        match mark 0x100000         # Gaming UDP traffic (advanced rules)
        match mark 0x100001         # Gaming TCP traffic (advanced rules)
        match mark 0x100002         # Steam gaming ports (advanced rules)

    # Streaming Traffic - High Bandwidth, Medium Priority
    # Matches streaming devices and video traffic
    class streaming commit 150mbit prio 2 ceil 400mbit
        match mark 0x20000          # Streaming devices (DMAC rules)
        match mark 0x200000         # Netflix streaming (advanced rules)
        match mark 0x200001         # YouTube streaming (advanced rules)
        match mark 0x200002         # Twitch streaming (advanced rules)

    # Work Traffic - Business Priority, Guaranteed Bandwidth
    # Matches work devices and business applications
    class work commit 80mbit prio 3 ceil 200mbit
        match mark 0x30000          # Work devices (DMAC rules)
        match mark 0x300000         # Work HTTPS traffic (advanced rules)
        match mark 0x300001         # SSH access (advanced rules)
        match mark 0x300002         # VPN traffic (advanced rules)

    # Mobile Devices - Standard Priority
    # Matches mobile devices and their typical traffic
    class mobile commit 50mbit prio 4 ceil 150mbit
        match mark 0x40000          # Mobile devices (DMAC rules)

    # IoT Devices - Low Priority, Limited Bandwidth
    # Matches IoT devices and smart home traffic
    class iot commit 10mbit prio 5 ceil 30mbit
        match mark 0x50000          # IoT devices (DMAC rules)

    # Default class for unmarked traffic
    class default prio 8

# =============================================================================
# Input Interface Configuration (Download Traffic)
# =============================================================================
# Mirror the same QoS classes for incoming traffic
# Note: Input shaping requires IFB (Intermediate Functional Block) devices

interface eth0 world-in input rate 1000mbit
    # Gaming Traffic - Highest Priority
    class gaming commit 100mbit prio 1 ceil 300mbit
        match mark 0x10000          # Gaming devices
        match mark 0x100000         # Gaming UDP traffic
        match mark 0x100001         # Gaming TCP traffic
        match mark 0x100002         # Steam gaming ports

    # Streaming Traffic - High Bandwidth
    class streaming commit 150mbit prio 2 ceil 400mbit
        match mark 0x20000          # Streaming devices
        match mark 0x200000         # Netflix streaming
        match mark 0x200001         # YouTube streaming
        match mark 0x200002         # Twitch streaming

    # Work Traffic - Business Priority
    class work commit 80mbit prio 3 ceil 200mbit
        match mark 0x30000          # Work devices
        match mark 0x300000         # Work HTTPS traffic
        match mark 0x300001         # SSH access
        match mark 0x300002         # VPN traffic

    # Mobile Devices - Standard Priority
    class mobile commit 50mbit prio 4 ceil 150mbit
        match mark 0x40000          # Mobile devices

    # IoT Devices - Low Priority
    class iot commit 10mbit prio 5 ceil 30mbit
        match mark 0x50000          # IoT devices

    # Default class for unmarked traffic
    class default prio 8

# =============================================================================
# Configuration Notes and Usage Guide
# =============================================================================
#
# BANDWIDTH ALLOCATION STRATEGY:
# -------------------------------
# - Gaming: Highest priority for low latency, moderate guaranteed bandwidth
# - Streaming: High bandwidth allocation for video content
# - Work: Business-critical applications get guaranteed bandwidth
# - Mobile: Standard allocation for phones/tablets
# - IoT: Limited bandwidth to prevent network congestion
# - Default: Unmarked traffic gets remaining bandwidth
#
# PRIORITY LEVELS (1 = highest, 8 = lowest):
# -------------------------------------------
# 1. Gaming (latency critical, real-time games)
# 2. Streaming (high bandwidth video content)
# 3. Work (business applications, VPN, SSH)
# 4. Mobile (phones, tablets)
# 5. IoT (smart home devices, sensors)
# 8. Default (unmarked traffic)
#
# QOS PARAMETERS EXPLAINED:
# --------------------------
# - commit: Guaranteed minimum bandwidth (always available)
# - ceil: Maximum bandwidth limit (burst capacity)
# - prio: Priority level (lower number = higher priority)
#
# INTEGRATION WITH TRAFFIC MARKING:
# ----------------------------------
# This configuration works with the nftables traffic marking hooks:
# 1. Configure device MAC addresses in traffic-marking.conf
# 2. Run traffic marking hooks to create nftables rules
# 3. nftables marks packets based on device identity and traffic type
# 4. FireQOS uses these marks to classify traffic into QoS classes
# 5. Result: Automatic QoS based on device and application type
#
# CUSTOMIZATION GUIDE:
# ---------------------
# 1. Adjust interface names (eth0) to match your setup
# 2. Modify bandwidth rates to match your connection speed
# 3. Tune commit/ceil values based on your requirements
# 4. Add/remove classes as needed for your environment
# 5. Test with: fireqos status, tc -s class show dev eth0
#
# TROUBLESHOOTING:
# ----------------
# - Check marks: nft list table inet qos_marking
# - Monitor traffic: tc -s class show dev eth0
# - Debug FireQOS: fireqos status
# - View active rules: fireqos show
#
# EXAMPLE VERIFICATION:
# ---------------------
# 1. Generate traffic from a gaming device
# 2. Check if packet gets marked: nft monitor
# 3. Verify QoS classification: tc -s class show dev eth0
# 4. Confirm gaming class gets traffic and priority
# 2. Gaming (latency sensitive)
# 3. Work (business critical)
# 4. Streaming (bandwidth hungry)
# 5. Mobile (standard usage)
# 6. File Transfer (can wait)
# 7. IoT (background traffic)
# 8. Bulk/P2P (best effort)
#
# Adjust the 'rate', 'commit', and 'ceil' values according to:
# - Your actual internet connection speed
# - Number of devices on your network
# - Your specific usage patterns
#
# Testing:
# - Monitor with: fireqos status
# - Check marks: nft list table inet qos_marking
# - Debug traffic: tcpdump -i any -n | grep "mark"
