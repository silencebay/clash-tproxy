# Traffic Marking Configuration for Mihomo Container
# This file configures nftables-based traffic marking for QoS with FireQOS
# 
# Usage: Copy this file to /config/hooks/config/traffic-marking.conf in your container
# The post-init hooks will automatically load and apply these rules

# =============================================================================
# DMAC (Destination MAC) Marking Rules
# =============================================================================
# Format: MAC_ADDRESS:MARK_VALUE:DESCRIPTION
# These rules mark packets based on destination MAC address

DMAC_RULES="
    # Gaming Devices - High Priority (0x10-0x1F)
    aa:bb:cc:dd:ee:01:0x10:PlayStation 5
    aa:bb:cc:dd:ee:02:0x11:Xbox Series X
    aa:bb:cc:dd:ee:03:0x12:Nintendo Switch
    aa:bb:cc:dd:ee:04:0x13:Gaming PC
    
    # Streaming Devices - Medium-High Priority (0x20-0x2F)
    bb:cc:dd:ee:ff:01:0x20:Apple TV 4K
    bb:cc:dd:ee:ff:02:0x21:NVIDIA Shield
    bb:cc:dd:ee:ff:03:0x22:Roku Ultra
    bb:cc:dd:ee:ff:04:0x23:Smart TV Samsung
    
    # Work Devices - Business Priority (0x30-0x3F)
    cc:dd:ee:ff:00:01:0x30:Work Laptop
    cc:dd:ee:ff:00:02:0x31:Work Desktop
    cc:dd:ee:ff:00:03:0x32:Office Printer
    
    # Mobile Devices - Standard Priority (0x40-0x4F)
    dd:ee:ff:00:11:01:0x40:iPhone 15 Pro
    dd:ee:ff:00:11:02:0x41:Samsung Galaxy S24
    dd:ee:ff:00:11:03:0x42:iPad Pro
    
    # IoT Devices - Low Priority (0x50-0x5F)
    ee:ff:00:11:22:01:0x50:Security Camera 1
    ee:ff:00:11:22:02:0x51:Security Camera 2
    ee:ff:00:11:22:03:0x52:Smart Doorbell
    ee:ff:00:11:22:04:0x53:Smart Thermostat
"

# =============================================================================
# Advanced Multi-Layer Marking Rules
# =============================================================================
# Format: MARK_VALUE:DESCRIPTION:CONDITION1=VALUE1,CONDITION2=VALUE2,...
# 
# Supported conditions:
# - dmac: destination MAC address
# - smac: source MAC address
# - src: source IP address/network
# - dst: destination IP address/network
# - sport: source port(s) - single port or range (e.g., 8000:8080)
# - dport: destination port(s) - single port or range
# - proto: protocol (tcp/udp/icmp)

ADVANCED_RULES="
    # Gaming Traffic - Specific devices + protocols
    0x100:Gaming UDP Traffic:dmac=aa:bb:cc:dd:ee:01,proto=udp
    0x101:Gaming TCP Traffic:dmac=aa:bb:cc:dd:ee:01,proto=tcp,dport=80:443
    0x102:Steam Gaming:src=192.168.1.0/24,dport=27015:27030,proto=udp
    0x103:Epic Games:src=192.168.1.0/24,dport=3478:3479,proto=udp
    
    # Streaming Services - High bandwidth, medium priority
    0x200:Netflix Streaming:dport=443,proto=tcp,dst=23.246.0.0/18
    0x201:YouTube Streaming:dport=443,proto=tcp,dst=172.217.0.0/16
    0x202:Twitch Streaming:dport=443,proto=tcp,dst=151.101.0.0/16
    0x203:Apple TV Streaming:dmac=bb:cc:dd:ee:ff:01,dport=80:443,proto=tcp
    
    # VoIP and Video Conferencing - Highest Priority
    0x300:SIP Signaling:dport=5060,proto=udp
    0x301:RTP Media:dport=10000:20000,proto=udp
    0x302:Zoom Meetings:dport=8801:8802,proto=udp
    0x303:Teams Calls:dport=3478:3481,proto=udp
    0x304:WhatsApp Calls:dport=3478,proto=udp
    
    # Work Traffic - Business applications
    0x400:HTTPS Work:smac=cc:dd:ee:ff:00:01,dport=443,proto=tcp
    0x401:SSH Access:smac=cc:dd:ee:ff:00:01,dport=22,proto=tcp
    0x402:VPN Traffic:src=192.168.1.0/24,dport=1194,proto=udp
    0x403:RDP Sessions:dport=3389,proto=tcp
    0x404:Email IMAP:dport=993,proto=tcp
    0x405:Email SMTP:dport=587,proto=tcp
    
    # File Transfer and Backup - Lower priority
    0x500:FTP Transfer:dport=21,proto=tcp
    0x501:SFTP Transfer:dport=22,proto=tcp,src=192.168.1.100
    0x502:Cloud Backup:dport=443,proto=tcp,dst=52.84.0.0/15
    0x503:NAS Access:dst=192.168.1.200,dport=445,proto=tcp
    
    # P2P and Bulk Downloads - Lowest priority
    0x600:BitTorrent:dport=6881:6889,proto=tcp
    0x601:BitTorrent UDP:dport=6881:6889,proto=udp
    0x602:eMule:dport=4662,proto=tcp
    
    # IoT Device Management
    0x700:Camera RTSP:smac=ee:ff:00:11:22:01,dport=554,proto=tcp
    0x701:Smart Home Hub:dst=192.168.1.150,proto=tcp
    0x702:Printer Jobs:dst=192.168.1.210,dport=631,proto=tcp
    
    # DNS and Network Services - Critical
    0x800:DNS Queries:dport=53,proto=udp
    0x801:NTP Sync:dport=123,proto=udp
    0x802:DHCP Requests:dport=67:68,proto=udp
"

# =============================================================================
# Configuration Notes
# =============================================================================
# 
# 1. MAC Address Format: Use colon-separated format (aa:bb:cc:dd:ee:ff)
# 2. Mark Values: Use hexadecimal format (0x10, 0x20, etc.)
# 3. IP Ranges: Support CIDR notation (192.168.1.0/24)
# 4. Port Ranges: Use colon for ranges (8000:8080) or single ports (80)
# 5. Protocols: tcp, udp, icmp
#
# Priority Scheme:
# 0x10-0x1F: Gaming (Highest)
# 0x20-0x2F: Streaming (High)  
# 0x30-0x3F: Work (Medium-High)
# 0x40-0x4F: Mobile (Medium)
# 0x50-0x5F: IoT (Low)
# 0x100+: Advanced rules with specific conditions
#
# Remember to:
# - Replace example MAC addresses with your actual device MACs
# - Adjust IP ranges to match your network
# - Modify port ranges based on your applications
# - Test rules with: /usr/share/mihomo/examples/hooks/tools/test-traffic-marking.sh
